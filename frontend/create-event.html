<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Create Event - Eventful</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body class="bg-gray-50">
		<!-- Navigation -->
		<nav class="bg-white shadow-md">
			<div class="mx-auto px-4 container">
				<div class="flex justify-between items-center h-16">
					<a href="dashboard.html" class="font-bold text-primary-600 text-2xl"
						>Eventful</a
					>
					<div class="flex items-center gap-4">
						<a
							href="dashboard.html"
							class="text-gray-700 hover:text-primary-600 transition"
							>Dashboard</a
						>
						<button
							id="logoutBtn"
							class="text-gray-700 hover:text-primary-600 transition">
							Logout
						</button>
					</div>
				</div>
			</div>
		</nav>

		<!-- Main Content -->
		<div class="mx-auto px-4 py-8 container">
			<div class="mx-auto max-w-3xl">
				<div class="mb-6">
					<h1 class="font-bold text-gray-900 text-3xl">Create New Event</h1>
					<p class="mt-2 text-gray-600">
						Fill in the details to create your event
					</p>
				</div>

				<form id="createEventForm" class="p-4 card">
					<!-- Event Title -->
					<div class="mb-6">
						<label class="block mb-2 font-medium text-gray-700">
							Event Title *
						</label>
						<input
							type="text"
							id="title"
							required
							class="input"
							placeholder="e.g., Tech Conference 2026" />
					</div>

					<!-- Description -->
					<div class="mb-6">
						<label class="block mb-2 font-medium text-gray-700">
							Description *
						</label>
						<textarea
							id="description"
							required
							rows="5"
							class="input"
							placeholder="Describe your event..."></textarea>
					</div>

					<!-- Category -->
					<div class="mb-6">
						<label class="block mb-2 font-medium text-gray-700">
							Category *
						</label>
						<select id="category" required class="input">
							<option value="">Select category</option>
							<option value="conference">Conference</option>
							<option value="workshop">Workshop</option>
							<option value="concert">Concert</option>
							<option value="sports">Sports</option>
							<option value="exhibition">Exhibition</option>
							<option value="networking">Networking</option>
							<option value="other">Other</option>
						</select>
					</div>

					<!-- Date and Time -->
					<div class="gap-6 grid grid-cols-1 md:grid-cols-2 mb-6">
						<div>
							<label class="block mb-2 font-medium text-gray-700">
								Start Date & Time *
							</label>
							<input
								type="datetime-local"
								id="startDate"
								required
								class="input" />
						</div>
						<div>
							<label class="block mb-2 font-medium text-gray-700">
								End Date & Time *
							</label>
							<input
								type="datetime-local"
								id="endDate"
								required
								class="input" />
						</div>
					</div>

					<!-- Venue and Address -->
					<div class="gap-6 grid grid-cols-1 md:grid-cols-2 mb-6">
						<div>
							<label class="block mb-2 font-medium text-gray-700">
								Venue Name *
							</label>
							<input
								type="text"
								id="venue"
								required
								class="input"
								placeholder="e.g., Lagos Convention Centre" />
						</div>
						<div>
							<label class="block mb-2 font-medium text-gray-700">
								Address *
							</label>
							<input
								type="text"
								id="address"
								required
								class="input"
								placeholder="e.g., 1 Festival Road, Victoria Island" />
						</div>
					</div>

					<!-- Pricing -->
					<div class="gap-6 grid grid-cols-1 md:grid-cols-2 mb-6">
						<div>
							<label class="block mb-2 font-medium text-gray-700">
								Ticket Price (₦) *
							</label>
							<input
								type="number"
								id="ticketPrice"
								required
								min="0"
								class="input"
								placeholder="0" />
						</div>
						<div>
							<label class="block mb-2 font-medium text-gray-700">
								Available Tickets *
							</label>
							<input
								type="number"
								id="totalTickets"
								required
								min="1"
								class="input"
								placeholder="100" />
						</div>
					</div>

					<!-- Image URL -->
					<div class="mb-6">
						<label class="block mb-2 font-medium text-gray-700">
							Event Image URL
						</label>
						<input
							type="url"
							id="imageUrl"
							class="input"
							placeholder="https://example.com/event-image.jpg" />
						<p class="mt-1 text-gray-500 text-xs">
							Optional: Add a URL to an image for your event
						</p>
					</div>

					<!-- Submit Button -->
					<div class="flex gap-4">
						<button
							type="button"
							onclick="window.location.href = 'dashboard.html'"
							class="flex-1 py-3 text-gray-700 btn btn-secondary">
							Cancel
						</button>
						<button
							type="submit"
							id="submitBtn"
							class="flex-1 py-3 btn btn-primary">
							Create Event
						</button>
					</div>
				</form>
			</div>
		</div>

		<script src="js/config.js"></script>
		<script src="js/main.js"></script>
		<script src="js/auth.js"></script>
		<script>
			// Check authentication
			requireAuth();

			const user = getUser();
			if (user && user.role !== "creator") {
				window.location.href = "events.html";
			}

			// Logout handler
			document.getElementById("logoutBtn").addEventListener("click", () => {
				logout();
			});

			// Form submission
			const createEventForm = document.getElementById("createEventForm");
			const submitBtn = document.getElementById("submitBtn");

			createEventForm.addEventListener("submit", async (e) => {
				e.preventDefault();

				const formData = {
					title: document.getElementById("title").value,
					description: document.getElementById("description").value,
					category: document.getElementById("category").value,
					venue: document.getElementById("venue").value,
					address: document.getElementById("address").value,
					startDate: document.getElementById("startDate").value,
					endDate: document.getElementById("endDate").value,
					ticketPrice: parseFloat(document.getElementById("ticketPrice").value),
					totalTickets: parseInt(document.getElementById("totalTickets").value),
					imageUrl: document.getElementById("imageUrl").value || null,
				};

				submitBtn.textContent = "Creating Event...";
				submitBtn.disabled = true;

				try {
					const response = await apiCall(API_ENDPOINTS.events, {
						method: "POST",
						headers: getAuthHeaders(),
						body: JSON.stringify(formData),
					});

					showToast("Event created successfully!", "success");

					setTimeout(() => {
						window.location.href = "dashboard.html";
					}, 1000);
				} catch (error) {
					showToast(error.message || "Failed to create event", "error");
					submitBtn.textContent = "Create Event";
					submitBtn.disabled = false;
				}
			});
		</script>
	</body>
</html>
