<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Creator Dashboard - Eventful</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body class="bg-gray-50">
		<!-- Navigation -->
		<nav class="bg-white shadow-md">
			<div class="mx-auto px-4 container">
				<div class="flex justify-between items-center h-16">
					<a href="index.html" class="font-bold text-primary-600 text-2xl"
						>Eventful</a
					>
					<div class="flex items-center gap-4">
						<span id="userName" class="text-gray-700"></span>
						<button
							id="logoutBtn"
							class="text-gray-700 hover:text-primary-600 transition">
							Logout
						</button>
					</div>
				</div>
			</div>
		</nav>

		<!-- Main Content -->
		<div class="mx-auto px-4 py-8 container">
			<!-- Header -->
			<div class="flex justify-between items-center mb-8">
				<div>
					<h1 class="font-bold text-gray-900 text-3xl">Creator Dashboard</h1>
					<p class="mt-2 text-gray-600">
						Manage your events and track performance
					</p>
				</div>
				<button
					onclick="window.location.href = 'create-event.html'"
					class="btn btn-primary">
					<svg
						class="inline-block mr-2 w-5 h-5"
						fill="none"
						stroke="currentColor"
						viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M12 4v16m8-8H4" />
					</svg>
					Create Event
				</button>
			</div>

			<!-- Stats Grid -->
			<div class="gap-6 grid grid-cols-1 md:grid-cols-4 mb-8">
				<div class="p-6 card">
					<div class="flex justify-between items-center">
						<div>
							<p class="text-gray-600 text-sm">Total Events</p>
							<p id="totalEvents" class="mt-2 font-bold text-gray-900 text-2xl">
								0
							</p>
						</div>
						<div
							class="flex justify-center items-center bg-primary-100 rounded-lg w-12 h-12">
							<svg
								class="w-6 h-6 text-primary-600"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24">
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
							</svg>
						</div>
					</div>
				</div>

				<div class="p-6 card">
					<div class="flex justify-between items-center">
						<div>
							<p class="text-gray-600 text-sm">Tickets Sold</p>
							<p
								id="totalTickets"
								class="mt-2 font-bold text-gray-900 text-2xl">
								0
							</p>
						</div>
						<div
							class="flex justify-center items-center bg-green-100 rounded-lg w-12 h-12">
							<svg
								class="w-6 h-6 text-green-600"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24">
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
							</svg>
						</div>
					</div>
				</div>

				<div class="p-6 card">
					<div class="flex justify-between items-center">
						<div>
							<p class="text-gray-600 text-sm">Total Revenue</p>
							<p
								id="totalRevenue"
								class="mt-2 font-bold text-gray-900 text-2xl">
								₦0
							</p>
						</div>
						<div
							class="flex justify-center items-center bg-blue-100 rounded-lg w-12 h-12">
							<svg
								class="w-6 h-6 text-blue-600"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24">
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
							</svg>
						</div>
					</div>
				</div>

				<div class="p-6 card">
					<div class="flex justify-between items-center">
						<div>
							<p class="text-gray-600 text-sm">Active Events</p>
							<p
								id="activeEvents"
								class="mt-2 font-bold text-gray-900 text-2xl">
								0
							</p>
						</div>
						<div
							class="flex justify-center items-center bg-purple-100 rounded-lg w-12 h-12">
							<svg
								class="w-6 h-6 text-purple-600"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24">
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M13 10V3L4 14h7v7l9-11h-7z" />
							</svg>
						</div>
					</div>
				</div>
			</div>

			<!-- Events List -->
			<div class="p-4 card">
				<div class="flex justify-between items-center mb-6">
					<h2 class="font-bold text-gray-900 text-xl">Your Events</h2>
					<div class="flex gap-2">
						<button
							class="hover:bg-gray-50 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 text-sm transition"
							onclick="filterEvents('all')">
							All
						</button>
						<button
							class="hover:bg-gray-50 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 text-sm transition"
							onclick="filterEvents('upcoming')">
							Upcoming
						</button>
						<button
							class="hover:bg-gray-50 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 text-sm transition"
							onclick="filterEvents('past')">
							Past
						</button>
					</div>
				</div>

				<div id="eventsList" class="space-y-4">
					<!-- Events will be loaded here -->
				</div>

				<div id="noEvents" class="py-12 text-center" style="display: none">
					<svg
						class="mx-auto w-16 h-16 text-gray-400"
						fill="none"
						stroke="currentColor"
						viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
					</svg>
					<h3 class="mt-4 font-medium text-gray-900 text-lg">No events yet</h3>
					<p class="mt-2 text-gray-600">
						Get started by creating your first event.
					</p>
					<button
						onclick="window.location.href = 'create-event.html'"
						class="mt-4 btn btn-primary">
						Create Event
					</button>
				</div>
			</div>
		</div>

		<script src="js/config.js"></script>
		<script src="js/main.js"></script>
		<script src="js/auth.js"></script>
		<script>
			// Check authentication
			requireAuth();

			const user = getUser();
			if (user && user.role !== "creator") {
				window.location.href = "events.html";
			}

			// Display user name
			if (user) {
				document.getElementById("userName").textContent =
					`${user.firstName} ${user.lastName}`;
			}

			// Logout handler
			document.getElementById("logoutBtn").addEventListener("click", () => {
				logout();
			});

			let allEvents = [];
			let currentFilter = "all";

			// Load dashboard data
			async function loadDashboard() {
				try {
					// Load creator's events using dedicated endpoint
					const eventsResponse = await apiCall(
						API_ENDPOINTS.events + "/my/events",
						{
							headers: getAuthHeaders(),
						},
					);

					// Handle different response formats
					allEvents = eventsResponse.data.events || eventsResponse.data || [];

					console.log("Loaded events:", allEvents);

					// Update stats
					updateStats();

					// Display events
					displayEvents();
				} catch (error) {
					console.error("Error loading dashboard:", error);
					showToast("Failed to load dashboard data", "error");
				}
			}

			function updateStats() {
				const totalEvents = allEvents.length;
				const activeEvents = allEvents.filter(
					(event) =>
						new Date(event.start_date || event.startDate || event.date) >
						new Date(),
				).length;

				// Calculate total tickets and revenue
				let totalTickets = 0;
				let totalRevenue = 0;

				allEvents.forEach((event) => {
					const ticketsSold =
						(event.total_tickets || event.totalTickets || 0) -
						(event.available_tickets || event.availableTickets || 0);
					const ticketPrice =
						event.ticket_price || event.ticketPrice || event.price || 0;

					totalTickets += ticketsSold;
					totalRevenue += ticketsSold * ticketPrice;
				});

				document.getElementById("totalEvents").textContent = totalEvents;
				document.getElementById("activeEvents").textContent = activeEvents;
				document.getElementById("totalTickets").textContent = totalTickets;
				document.getElementById("totalRevenue").textContent =
					formatCurrency(totalRevenue);
			}

			function displayEvents() {
				const eventsList = document.getElementById("eventsList");
				const noEvents = document.getElementById("noEvents");

				let filteredEvents = allEvents;

				if (currentFilter === "upcoming") {
					filteredEvents = allEvents.filter(
						(event) =>
							new Date(event.start_date || event.startDate || event.date) >
							new Date(),
					);
				} else if (currentFilter === "past") {
					filteredEvents = allEvents.filter(
						(event) =>
							new Date(event.start_date || event.startDate || event.date) <=
							new Date(),
					);
				}

				if (filteredEvents.length === 0) {
					eventsList.innerHTML = "";
					noEvents.style.display = "block";
					return;
				}

				noEvents.style.display = "none";

				eventsList.innerHTML = filteredEvents
					.map((event) => {
						const eventDate = event.start_date || event.startDate || event.date;
						const eventVenue = event.venue || event.location || "Online";
						const ticketPrice =
							event.ticket_price || event.ticketPrice || event.price || 0;
						const ticketsSold =
							(event.total_tickets || event.totalTickets || 0) -
							(event.available_tickets || event.availableTickets || 0);

						return `
					<div class="flex justify-between items-center p-4 border border-gray-200 hover:border-primary-300 rounded-lg transition">
						<div class="flex-1">
							<h3 class="font-semibold text-gray-900 text-lg">${event.title}</h3>
							<div class="flex gap-4 mt-2 text-gray-600 text-sm">
								<span>📅 ${formatDate(eventDate)}</span>
								<span>📍 ${eventVenue}</span>
								<span>💰 ${formatCurrency(ticketPrice)}</span>
								<span>🎟️ ${ticketsSold} tickets sold</span>
							</div>
						</div>
						<div class="flex gap-2">
							<button 
								onclick="viewEvent('${event.id}')"
								class="hover:bg-gray-50 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 text-sm transition">
								View
							</button>
							<button 
								onclick="editEvent('${event.id}')"
								class="bg-primary-600 hover:bg-primary-700 px-4 py-2 rounded-lg text-white text-sm transition">
								Edit
							</button>
						</div>
					</div>
				`;
					})
					.join("");
			}

			function filterEvents(filter) {
				currentFilter = filter;
				displayEvents();
			}

			function viewEvent(id) {
				window.location.href = `event-details.html?id=${id}`;
			}

			function editEvent(id) {
				window.location.href = `edit-event.html?id=${id}`;
			}

			// Load dashboard on page load
			loadDashboard();
		</script>
	</body>
</html>
