<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Tickets - Eventful</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body class="bg-gray-50">
		<!-- Navigation -->
		<nav class="bg-white shadow-md">
			<div class="mx-auto px-4 container">
				<div class="flex justify-between items-center h-16">
					<a href="index.html" class="font-bold text-primary-600 text-2xl"
						>Eventful</a
					>
					<div class="flex items-center gap-4">
						<a
							href="events.html"
							class="text-gray-700 hover:text-primary-600 transition"
							>Events</a
						>
						<span id="userName" class="text-gray-700"></span>
						<button
							id="logoutBtn"
							class="text-gray-700 hover:text-primary-600 transition">
							Logout
						</button>
					</div>
				</div>
			</div>
		</nav>

		<!-- Main Content -->
		<div class="mx-auto px-4 py-8 container">
			<h1 class="mb-6 font-bold text-gray-900 text-3xl">My Tickets</h1>

			<div
				id="ticketsList"
				class="gap-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
				<!-- Tickets will be loaded here -->
			</div>

			<div id="noTickets" class="py-12 text-center" style="display: none">
				<svg
					class="mx-auto w-16 h-16 text-gray-400"
					fill="none"
					stroke="currentColor"
					viewBox="0 0 24 24">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
				</svg>
				<h3 class="mt-4 font-medium text-gray-900 text-lg">No tickets yet</h3>
				<p class="mt-2 text-gray-600">Purchase tickets to see them here</p>
				<button
					onclick="window.location.href = 'events.html'"
					class="mt-4 btn btn-primary">
					Browse Events
				</button>
			</div>
		</div>

		<script src="js/config.js"></script>
		<script src="js/main.js"></script>
		<script src="js/auth.js"></script>
		<script>
			requireAuth();

			const user = getUser();
			if (user) {
				document.getElementById("userName").textContent =
					`${user.firstName} ${user.lastName}`;
			}

			document.getElementById("logoutBtn").addEventListener("click", () => {
				logout();
			});

			async function loadTickets() {
				try {
					const response = await apiCall(API_ENDPOINTS.tickets, {
						headers: getAuthHeaders(),
					});

					const tickets = response.data.tickets || response.data || [];

					if (tickets.length === 0) {
						document.getElementById("noTickets").style.display = "block";
						return;
					}

					document.getElementById("ticketsList").innerHTML = tickets
						.map(
							(ticket) => `
						<div class="card">
							<div class="mb-4">
								<h3 class="font-semibold text-gray-900 text-lg">${ticket.event?.title || "Event"}</h3>
								<p class="mt-1 text-gray-600 text-sm">${formatDateTime(ticket.event?.date || ticket.eventDate)}</p>
							</div>
							
							<div class="space-y-2 mb-4 text-gray-600 text-sm">
								<p>📍 ${ticket.event?.location || "Location TBA"}</p>
								<p>🎟️ Ticket #${ticket.ticketNumber || ticket.ticket_number}</p>
								<p>💰 ${formatCurrency(ticket.price)}</p>
								<p class="flex items-center gap-2">
									Status: 
									<span class="px-2 py-1 rounded text-xs ${
										ticket.status === "valid" || ticket.status === "active"
											? "bg-green-100 text-green-800"
											: "bg-gray-100 text-gray-800"
									}">
										${ticket.status || "Valid"}
									</span>
								</p>
							</div>

							${
								ticket.qrCode || ticket.qr_code
									? `
								<div class="bg-white mb-4 p-4 rounded-lg text-center">
									<img src="${ticket.qrCode || ticket.qr_code}" alt="QR Code" class="mx-auto w-32 h-32" />
								</div>
							`
									: ""
							}

							<div class="flex gap-2">
								<button
									onclick="downloadTicket('${ticket.id}')"
									class="flex-1 py-2 text-sm btn btn-secondary">
									Download
								</button>
								<button
									onclick="viewTicket('${ticket.id}')"
									class="flex-1 py-2 text-sm btn btn-primary">
									View Details
								</button>
							</div>
						</div>
					`,
						)
						.join("");
				} catch (error) {
					console.error("Error loading tickets:", error);
					showToast("Failed to load tickets", "error");
				}
			}

			function downloadTicket(ticketId) {
				showToast("Download functionality coming soon", "info");
			}

			function viewTicket(ticketId) {
				window.location.href = `ticket-details.html?id=${ticketId}`;
			}

			loadTickets();
		</script>
	</body>
</html>
