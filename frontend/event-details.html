<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Event Details - Eventful</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body class="bg-gray-50">
		<!-- Navigation -->
		<nav class="bg-white shadow-md">
			<div class="mx-auto px-4 container">
				<div class="flex justify-between items-center h-16">
					<a href="index.html" class="font-bold text-primary-600 text-2xl"
						>Eventful</a
					>
					<div class="flex items-center gap-4">
						<a
							href="events.html"
							class="text-gray-700 hover:text-primary-600 transition"
							>Events</a
						>
						<span id="userNav"></span>
					</div>
				</div>
			</div>
		</nav>

		<!-- Main Content -->
		<div class="mx-auto px-4 py-8 container">
			<div id="eventDetails" class="mx-auto max-w-4xl">
				<!-- Loading state -->
				<div id="loading" class="py-12 text-center">
					<div
						class="inline-block border-4 border-gray-300 border-t-primary-600 rounded-full w-12 h-12 animate-spin"></div>
					<p class="mt-4 text-gray-600">Loading event...</p>
				</div>

				<!-- Event content will be loaded here -->
			</div>
		</div>

		<script src="js/config.js"></script>
		<script src="js/main.js"></script>
		<script src="js/auth.js"></script>
		<script>
			// Update navigation based on auth status
			updateUIForAuth();

			const urlParams = new URLSearchParams(window.location.search);
			const eventId = urlParams.get("id");

			if (!eventId) {
				window.location.href = "events.html";
			}

			async function loadEvent() {
				try {
					const response = await apiCall(`${API_ENDPOINTS.events}/${eventId}`);
					const event = response.data;

					console.log("Event data:", event); // Debug log

					document.getElementById("loading").style.display = "none";

					const user = getUser();
					const isCreator =
						user &&
						(event.creator_id === user.id || event.creatorId === user.id);

					// Handle field name variations (snake_case from DB, camelCase from API)
					const eventImage = event.image_url || event.imageUrl;
					const eventDate = event.start_date || event.startDate || event.date;
					const eventVenue = event.venue || event.location;
					const eventAddress = event.address || "";
					const eventPrice =
						event.ticket_price || event.ticketPrice || event.price || 0;
					const availableTickets =
						event.available_tickets || event.availableTickets || 0;
					const totalTickets = event.total_tickets || event.totalTickets || 0;

					document.getElementById("eventDetails").innerHTML = `
						<!-- Back Button -->
						<button
							onclick="window.history.back()"
							class="flex items-center gap-2 mb-6 text-gray-600 hover:text-gray-900 transition">
							<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
							</svg>
							Back
						</button>

						<!-- Event Header -->
						<div class="mb-6 card">
							${eventImage ? `<img src="${eventImage}" alt="${event.title}" class="mb-6 rounded-lg w-full h-64 object-cover" />` : ""}
							
							<div class="flex justify-between items-start">
								<div class="flex-1">
									<h1 class="font-bold text-gray-900 text-3xl">${event.title}</h1>
									<div class="flex flex-wrap gap-4 mt-4 text-gray-600">
										<span class="flex items-center gap-2">
											<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
											</svg>
											${formatDate(eventDate)} ${formatTime(eventDate)}
										</span>
										<span class="flex items-center gap-2">
											<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
											</svg>
											${eventVenue}${eventAddress ? `, ${eventAddress}` : ""}
										</span>
										<span class="flex items-center gap-2">
											<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
											</svg>
											${event.category}
										</span>
									</div>
								</div>
								${
									isCreator
										? `
									<button
										onclick="window.location.href='edit-event.html?id=${event.id}'"
										class="btn btn-secondary">
										Edit Event
									</button>
								`
										: ""
								}
							</div>
						</div>

						<!-- Event Details -->
						<div class="gap-6 grid grid-cols-1 md:grid-cols-3">
							<!-- Main Content -->
							<div class="space-y-6 md:col-span-2">
								<div class="card">
									<h2 class="mb-4 font-semibold text-gray-900 text-xl">About This Event</h2>
									<p class="text-gray-600 leading-relaxed whitespace-pre-wrap">${event.description}</p>
								</div>

								<!-- Event Details Info -->
								<div class="card">
									<h2 class="mb-4 font-semibold text-gray-900 text-xl">Event Information</h2>
									<div class="space-y-3">
										<div class="flex items-start gap-3">
											<svg class="mt-0.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
											</svg>
											<div>
												<p class="font-medium text-gray-900">Date & Time</p>
												<p class="text-gray-600 text-sm">${formatDate(eventDate)} at ${formatTime(eventDate)}</p>
											</div>
										</div>
										<div class="flex items-start gap-3">
											<svg class="mt-0.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
											</svg>
											<div>
												<p class="font-medium text-gray-900">Venue</p>
												<p class="text-gray-600 text-sm">${eventVenue}</p>
												${eventAddress ? `<p class="text-gray-600 text-sm">${eventAddress}</p>` : ""}
											</div>
										</div>
										<div class="flex items-start gap-3">
											<svg class="mt-0.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
												<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
											</svg>
											<div>
												<p class="font-medium text-gray-900">Category</p>
												<p class="text-gray-600 text-sm capitalize">${event.category}</p>
											</div>
										</div>
									</div>
								</div>
							</div>

							<!-- Sidebar -->
							<div class="space-y-6">
								<!-- Ticket Card -->
								<div class="card">
									<h3 class="mb-4 font-semibold text-gray-900 text-lg">Tickets</h3>
									<div class="space-y-3">
										<div class="flex justify-between items-center">
											<span class="text-gray-600">Price</span>
											<span class="font-semibold text-gray-900 text-xl">${formatCurrency(eventPrice)}</span>
										</div>
										<div class="flex justify-between items-center">
											<span class="text-gray-600">Available</span>
											<span class="font-semibold text-gray-900">${availableTickets} / ${totalTickets}</span>
										</div>
										<div class="pt-3 border-gray-200 border-t">
											<div class="flex justify-between items-center text-sm">
												<span class="text-gray-600">Tickets Sold</span>
												<span class="font-medium text-gray-900">${totalTickets - availableTickets}</span>
											</div>
										</div>
									</div>
									${
										!isCreator
											? `
										<button
											onclick="purchaseTicket('${event.id}')"
											class="mt-6 py-3 w-full btn btn-primary"
											${availableTickets <= 0 ? "disabled" : ""}>
											${availableTickets <= 0 ? "Sold Out" : "Buy Tickets"}
										</button>
									`
											: `
										<div class="bg-blue-50 mt-6 p-3 rounded-lg">
											<p class="text-blue-800 text-sm text-center">You are the creator of this event</p>
										</div>
									`
									}
								</div>

								<!-- Share Card -->
								<div class="card">
									<h3 class="mb-4 font-semibold text-gray-900 text-lg">Share Event</h3>
									<div class="flex gap-2">
										<button
											onclick="shareEvent('facebook')"
											class="flex-1 hover:bg-gray-50 py-2 border border-gray-300 rounded-lg transition"
											title="Share on Facebook">
											📘
										</button>
										<button
											onclick="shareEvent('twitter')"
											class="flex-1 hover:bg-gray-50 py-2 border border-gray-300 rounded-lg transition"
											title="Share on Twitter">
											🐦
										</button>
										<button
											onclick="shareEvent('whatsapp')"
											class="flex-1 hover:bg-gray-50 py-2 border border-gray-300 rounded-lg transition"
											title="Share on WhatsApp">
											💬
										</button>
										<button
											onclick="copyLink()"
											class="flex-1 hover:bg-gray-50 py-2 border border-gray-300 rounded-lg transition"
											title="Copy link">
											🔗
										</button>
									</div>
								</div>
							</div>
						</div>
					`;
				} catch (error) {
					console.error("Error loading event:", error);
					document.getElementById("loading").innerHTML = `
						<div class="py-12 text-center">
							<svg class="mx-auto w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
								<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
							</svg>
							<h3 class="mt-4 font-medium text-gray-900 text-lg">Event not found</h3>
							<p class="mt-2 text-gray-600">The event you're looking for doesn't exist.</p>
							<button onclick="window.location.href='events.html'" class="mt-4 btn btn-primary">
								Browse Events
							</button>
						</div>
					`;
				}
			}

			function purchaseTicket(eventId) {
				if (!isAuthenticated()) {
					showToast("Please login to purchase tickets", "error");
					setTimeout(() => {
						window.location.href = "login.html";
					}, 1000);
					return;
				}
				window.location.href = `purchase.html?eventId=${eventId}`;
			}

			function shareEvent(platform) {
				const url = window.location.href;
				const text = document.querySelector("h1").textContent;

				let shareUrl;
				switch (platform) {
					case "facebook":
						shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
						break;
					case "twitter":
						shareUrl = `https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
						break;
					case "whatsapp":
						shareUrl = `https://wa.me/?text=${encodeURIComponent(text + " " + url)}`;
						break;
				}

				if (shareUrl) {
					window.open(shareUrl, "_blank", "width=600,height=400");
				}
			}

			function copyLink() {
				navigator.clipboard.writeText(window.location.href);
				showToast("Link copied to clipboard!", "success");
			}

			// Load event on page load
			loadEvent();
		</script>
	</body>
</html>
