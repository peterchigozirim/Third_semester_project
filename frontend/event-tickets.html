<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Event Tickets - Eventful</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body class="bg-gray-50">
		<!-- Navigation -->
		<nav class="bg-white shadow-md">
			<div class="mx-auto px-4 container">
				<div class="flex justify-between items-center h-16">
					<a href="index.html" class="font-bold text-primary-600 text-2xl"
						>Eventful</a
					>
					<div class="flex items-center gap-4">
						<a
							href="events.html"
							class="text-gray-700 hover:text-primary-600 transition"
							>Events</a
						>
						<a
							href="dashboard.html"
							class="text-gray-700 hover:text-primary-600 transition"
							>Dashboard</a
						>
						<span id="userName" class="text-gray-700"></span>
						<button
							id="logoutBtn"
							class="text-gray-700 hover:text-primary-600 transition">
							Logout
						</button>
					</div>
				</div>
			</div>
		</nav>

		<!-- Main Content -->
		<div class="mx-auto px-4 py-8 container">
			<!-- Back Button -->
			<button
				onclick="window.history.back()"
				class="flex items-center gap-2 mb-6 text-gray-700 hover:text-primary-600 transition">
				<svg
					class="w-5 h-5"
					fill="none"
					stroke="currentColor"
					viewBox="0 0 24 24">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M15 19l-7-7 7-7" />
				</svg>
				Back to Dashboard
			</button>

			<!-- Loading State -->
			<div id="loading" class="py-12 text-center">
				<div
					class="inline-block border-4 border-primary-600 border-t-transparent rounded-full w-12 h-12 animate-spin"></div>
				<p class="mt-4 text-gray-600">Loading tickets...</p>
			</div>

			<!-- Error State -->
			<div id="error" class="hidden py-12 text-center">
				<svg
					class="mx-auto w-16 h-16 text-red-400"
					fill="none"
					stroke="currentColor"
					viewBox="0 0 24 24">
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
						d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
				</svg>
				<h3 class="mt-4 font-medium text-gray-900 text-lg">
					Error Loading Tickets
				</h3>
				<p id="errorMessage" class="mt-2 text-gray-600"></p>
				<button
					onclick="window.location.href = 'dashboard.html'"
					class="mt-4 btn btn-primary">
					Back to Dashboard
				</button>
			</div>

			<!-- Tickets Content -->
			<div id="ticketsContent" class="hidden">
				<!-- Event Header -->
				<div class="bg-white shadow-md mb-6 p-6 rounded-lg">
					<div
						class="flex md:flex-row flex-col justify-between items-start gap-4">
						<div class="flex-1">
							<h1
								id="eventTitle"
								class="mb-2 font-bold text-gray-900 text-3xl"></h1>
							<p id="eventDate" class="text-gray-600"></p>
							<p id="eventVenue" class="mt-1 text-gray-600"></p>
						</div>
						<div class="flex gap-4">
							<div class="bg-blue-50 px-6 py-4 rounded-lg text-center">
								<p
									class="font-semibold text-blue-600 text-2xl"
									id="totalTickets">
									0
								</p>
								<p class="text-blue-800 text-sm">Total Sold</p>
							</div>
							<div class="bg-green-50 px-6 py-4 rounded-lg text-center">
								<p
									class="font-semibold text-green-600 text-2xl"
									id="scannedTickets">
									0
								</p>
								<p class="text-green-800 text-sm">Scanned</p>
							</div>
							<div class="bg-purple-50 px-6 py-4 rounded-lg text-center">
								<p
									class="font-semibold text-purple-600 text-2xl"
									id="totalRevenue">
									$0
								</p>
								<p class="text-purple-800 text-sm">Revenue</p>
							</div>
						</div>
					</div>
				</div>

				<!-- Filters and Search -->
				<div class="bg-white shadow-md mb-6 p-4 rounded-lg">
					<div class="gap-4 grid grid-cols-1 md:grid-cols-4">
						<div class="md:col-span-2">
							<input
								type="text"
								id="searchInput"
								placeholder="Search by name, email, or ticket code..."
								class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 w-full"
								oninput="filterTickets()" />
						</div>
						<select
							id="statusFilter"
							class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500"
							onchange="filterTickets()">
							<option value="all">All Status</option>
							<option value="valid">Valid (Not Scanned)</option>
							<option value="used">Used (Scanned)</option>
						</select>
						<button
							onclick="exportTickets()"
							class="flex justify-center items-center gap-2 btn btn-secondary">
							<svg
								class="w-5 h-5"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24">
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
							</svg>
							Export CSV
						</button>
					</div>
				</div>

				<!-- No Tickets -->
				<div
					id="noTickets"
					class="hidden bg-white shadow-md p-12 rounded-lg text-center">
					<svg
						class="mx-auto w-16 h-16 text-gray-400"
						fill="none"
						stroke="currentColor"
						viewBox="0 0 24 24">
						<path
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
							d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
					</svg>
					<h3 class="mt-4 font-medium text-gray-900 text-lg">
						No Tickets Sold Yet
					</h3>
					<p class="mt-2 text-gray-600">
						Tickets will appear here once people start purchasing
					</p>
				</div>

				<!-- Tickets Table -->
				<div
					id="ticketsTable"
					class="bg-white shadow-md rounded-lg overflow-hidden">
					<div class="overflow-x-auto">
						<table class="divide-y divide-gray-200 min-w-full">
							<thead class="bg-gray-50">
								<tr>
									<th
										class="px-6 py-3 font-medium text-gray-700 text-xs text-left uppercase tracking-wider">
										Ticket Code
									</th>
									<th
										class="px-6 py-3 font-medium text-gray-700 text-xs text-left uppercase tracking-wider">
										Attendee
									</th>
									<th
										class="px-6 py-3 font-medium text-gray-700 text-xs text-left uppercase tracking-wider">
										Contact
									</th>
									<th
										class="px-6 py-3 font-medium text-gray-700 text-xs text-left uppercase tracking-wider">
										Purchase Date
									</th>
									<th
										class="px-6 py-3 font-medium text-gray-700 text-xs text-left uppercase tracking-wider">
										Amount
									</th>
									<th
										class="px-6 py-3 font-medium text-gray-700 text-xs text-left uppercase tracking-wider">
										Status
									</th>
									<th
										class="px-6 py-3 font-medium text-gray-700 text-xs text-left uppercase tracking-wider">
										Actions
									</th>
								</tr>
							</thead>
							<tbody
								id="ticketsTableBody"
								class="bg-white divide-y divide-gray-200">
								<!-- Tickets will be loaded here -->
							</tbody>
						</table>
					</div>
				</div>

				<!-- Pagination -->
				<div
					id="pagination"
					class="flex justify-center items-center gap-2 mt-6">
					<!-- Pagination will be added here if needed -->
				</div>
			</div>
		</div>

		<!-- Ticket Detail Modal -->
		<div
			id="ticketModal"
			class="hidden z-50 fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto">
			<div class="flex justify-center items-center p-4 min-h-screen">
				<div
					class="bg-white shadow-xl mx-auto rounded-lg max-w-2xl overflow-hidden">
					<div
						class="flex justify-between items-center bg-primary-600 p-6 text-white">
						<h3 class="font-bold text-xl">Ticket Details</h3>
						<button onclick="closeTicketModal()" class="hover:text-gray-200">
							<svg
								class="w-6 h-6"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24">
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="2"
									d="M6 18L18 6M6 6l12 12" />
							</svg>
						</button>
					</div>
					<div id="ticketModalContent" class="p-6">
						<!-- Content will be loaded here -->
					</div>
				</div>
			</div>
		</div>

		<script src="js/config.js"></script>
		<script src="js/main.js"></script>
		<script src="js/auth.js"></script>
		<script>
			requireAuth();

			const user = getUser();
			if (user) {
				document.getElementById("userName").textContent =
					`${user.firstName} ${user.lastName}`;
			}

			// Redirect if not a creator
			if (user && user.role !== "creator") {
				showToast("Only creators can access this page", "error");
				setTimeout(() => {
					window.location.href = "index.html";
				}, 2000);
			}

			document.getElementById("logoutBtn").addEventListener("click", () => {
				logout();
			});

			let allTickets = [];
			let filteredTickets = [];
			let currentEvent = null;

			async function loadEventTickets() {
				try {
					// Get event ID from URL
					const urlParams = new URLSearchParams(window.location.search);
					const eventId = urlParams.get("id");

					console.log("=== Event Tickets Debug ===");
					console.log("Event ID from URL:", eventId);

					if (!eventId) {
						showErrorState("No event ID provided");
						return;
					}

					// Fetch event details
					console.log("Fetching event details...");
					const eventResponse = await apiCall(
						`${API_ENDPOINTS.events}/${eventId}`,
						{
							headers: getAuthHeaders(),
						},
					);

					console.log("Event Response:", eventResponse);
					currentEvent = eventResponse.data;
					console.log("Current Event:", currentEvent);

					// Fetch tickets for this event
					const ticketsEndpoint = API_ENDPOINTS.eventTickets(eventId);
					console.log("Fetching tickets from:", ticketsEndpoint);

					const ticketsResponse = await apiCall(ticketsEndpoint, {
						headers: getAuthHeaders(),
					});

					console.log("Tickets Response:", ticketsResponse);
					console.log("Tickets Response.data:", ticketsResponse.data);
					console.log("Is Array?", Array.isArray(ticketsResponse.data));

					allTickets = Array.isArray(ticketsResponse.data)
						? ticketsResponse.data
						: ticketsResponse.data.tickets || [];

					console.log("All Tickets:", allTickets);
					console.log("Total tickets:", allTickets.length);

					filteredTickets = [...allTickets];

					displayEventInfo();
					displayTickets();

					// Hide loading, show content
					document.getElementById("loading").classList.add("hidden");
					document.getElementById("ticketsContent").classList.remove("hidden");
				} catch (error) {
					console.error("Error loading tickets:", error);
					console.error("Error details:", error.message, error.stack);
					showErrorState(error.message || "Failed to load tickets");
				}
			}
			function displayEventInfo() {
				if (!currentEvent) return;

				document.getElementById("eventTitle").textContent = currentEvent.title;
				document.getElementById("eventDate").textContent = `📅 ${formatDateTime(
					currentEvent.start_date,
				)}`;
				document.getElementById("eventVenue").textContent =
					`📍 ${currentEvent.venue}${currentEvent.address ? ", " + currentEvent.address : ""}`;

				// Calculate stats
				const totalTickets = allTickets.length;
				const scannedTickets = allTickets.filter((t) => t.is_scanned).length;
				const totalRevenue = allTickets.reduce(
					(sum, t) => sum + (parseFloat(t.paid_amount) || 0),
					0,
				);

				document.getElementById("totalTickets").textContent = totalTickets;
				document.getElementById("scannedTickets").textContent = scannedTickets;
				document.getElementById("totalRevenue").textContent =
					`$${totalRevenue.toFixed(2)}`;
			}

			function displayTickets() {
				if (filteredTickets.length === 0) {
					document.getElementById("ticketsTable").classList.add("hidden");
					document.getElementById("noTickets").classList.remove("hidden");
					return;
				}

				document.getElementById("ticketsTable").classList.remove("hidden");
				document.getElementById("noTickets").classList.add("hidden");

				const tbody = document.getElementById("ticketsTableBody");
				tbody.innerHTML = filteredTickets
					.map((ticket) => {
						const statusClass = ticket.is_scanned
							? "bg-gray-100 text-gray-800"
							: "bg-green-100 text-green-800";
						const statusText = ticket.is_scanned ? "Used" : "Valid";

						return `
							<tr class="hover:bg-gray-50">
								<td class="px-6 py-4 whitespace-nowrap">
									<div class="font-mono font-medium text-gray-900 text-sm">
										${ticket.ticket_code}
									</div>
								</td>
								<td class="px-6 py-4 whitespace-nowrap">
									<div class="font-medium text-gray-900 text-sm">
										${ticket.first_name} ${ticket.last_name}
									</div>
								</td>
								<td class="px-6 py-4 whitespace-nowrap">
									<div class="text-gray-900 text-sm">${ticket.email}</div>
									${ticket.phone ? `<div class="text-gray-500 text-xs">${ticket.phone}</div>` : ""}
								</td>
								<td class="px-6 py-4 text-gray-500 text-sm whitespace-nowrap">
									${formatDateTime(ticket.created_at)}
								</td>
								<td class="px-6 py-4 text-gray-900 text-sm whitespace-nowrap">
									$${parseFloat(ticket.paid_amount || 0).toFixed(2)}
								</td>
								<td class="px-6 py-4 whitespace-nowrap">
									<span class="inline-flex px-2 py-1 rounded-full font-semibold text-xs leading-5 ${statusClass}">
										${statusText}
									</span>
									${ticket.is_scanned && ticket.scanned_at ? `<div class="mt-1 text-gray-500 text-xs">Scanned: ${formatDateTime(ticket.scanned_at)}</div>` : ""}
								</td>
								<td class="px-6 py-4 text-sm whitespace-nowrap">
									<button
										onclick="viewTicketDetails('${ticket.id}')"
										class="text-primary-600 hover:text-primary-900">
										View
									</button>
								</td>
							</tr>
						`;
					})
					.join("");
			}

			function filterTickets() {
				const searchTerm = document
					.getElementById("searchInput")
					.value.toLowerCase();
				const statusFilter = document.getElementById("statusFilter").value;

				filteredTickets = allTickets.filter((ticket) => {
					// Search filter
					const matchesSearch =
						!searchTerm ||
						ticket.first_name.toLowerCase().includes(searchTerm) ||
						ticket.last_name.toLowerCase().includes(searchTerm) ||
						ticket.email.toLowerCase().includes(searchTerm) ||
						ticket.ticket_code.toLowerCase().includes(searchTerm);

					// Status filter
					const matchesStatus =
						statusFilter === "all" ||
						(statusFilter === "valid" && !ticket.is_scanned) ||
						(statusFilter === "used" && ticket.is_scanned);

					return matchesSearch && matchesStatus;
				});

				displayTickets();
			}

			function viewTicketDetails(ticketId) {
				const ticket = allTickets.find((t) => t.id === ticketId);
				if (!ticket) return;

				const statusClass = ticket.is_scanned
					? "bg-gray-100 text-gray-800"
					: "bg-green-100 text-green-800";
				const statusText = ticket.is_scanned ? "Used" : "Valid";

				const modalContent = document.getElementById("ticketModalContent");
				modalContent.innerHTML = `
					<div class="space-y-4">
						<div class="gap-4 grid grid-cols-2">
							<div>
								<p class="font-medium text-gray-700 text-sm">Ticket Code</p>
								<p class="font-mono font-semibold text-gray-900">${ticket.ticket_code}</p>
							</div>
							<div>
								<p class="font-medium text-gray-700 text-sm">Status</p>
								<span class="inline-flex px-3 py-1 rounded-full font-semibold text-sm ${statusClass}">
									${statusText}
								</span>
							</div>
						</div>

						<div class="pt-4 border-gray-200 border-t">
							<h4 class="mb-3 font-semibold text-gray-900">Attendee Information</h4>
							<div class="space-y-2">
								<div>
									<p class="font-medium text-gray-700 text-sm">Name</p>
									<p class="text-gray-900">${ticket.first_name} ${ticket.last_name}</p>
								</div>
								<div>
									<p class="font-medium text-gray-700 text-sm">Email</p>
									<p class="text-gray-900">${ticket.email}</p>
								</div>
								${
									ticket.phone
										? `
									<div>
										<p class="font-medium text-gray-700 text-sm">Phone</p>
										<p class="text-gray-900">${ticket.phone}</p>
									</div>
								`
										: ""
								}
							</div>
						</div>

						<div class="pt-4 border-gray-200 border-t">
							<h4 class="mb-3 font-semibold text-gray-900">Purchase Information</h4>
							<div class="space-y-2">
								<div>
									<p class="font-medium text-gray-700 text-sm">Purchase Date</p>
									<p class="text-gray-900">${formatDateTime(ticket.payment_date || ticket.created_at)}</p>
								</div>
								<div>
									<p class="font-medium text-gray-700 text-sm">Amount Paid</p>
									<p class="text-gray-900">$${parseFloat(ticket.paid_amount || 0).toFixed(2)}</p>
								</div>
								<div>
									<p class="font-medium text-gray-700 text-sm">Payment Status</p>
									<p class="text-gray-900">${ticket.payment_status || "Completed"}</p>
								</div>
							</div>
						</div>

						${
							ticket.is_scanned
								? `
							<div class="pt-4 border-gray-200 border-t">
								<h4 class="mb-3 font-semibold text-gray-900">Scan Information</h4>
								<div>
									<p class="font-medium text-gray-700 text-sm">Scanned At</p>
									<p class="text-gray-900">${formatDateTime(ticket.scanned_at)}</p>
								</div>
							</div>
						`
								: ""
						}

						<div class="flex gap-3 pt-4">
							<button onclick="closeTicketModal()" class="flex-1 btn btn-secondary">
								Close
							</button>
							${
								!ticket.is_scanned
									? `
								<button onclick="markAsScanned('${ticket.id}')" class="flex-1 btn btn-primary">
									Mark as Scanned
								</button>
							`
									: ""
							}
						</div>
					</div>
				`;

				document.getElementById("ticketModal").classList.remove("hidden");
			}

			function closeTicketModal() {
				document.getElementById("ticketModal").classList.add("hidden");
			}

			async function markAsScanned(ticketId) {
				const ticket = allTickets.find((t) => t.id === ticketId);
				if (!ticket) return;

				if (
					!confirm(
						`Mark ticket ${ticket.ticket_code} as scanned? This action cannot be undone.`,
					)
				) {
					return;
				}

				try {
					await apiCall(API_ENDPOINTS.scanTicket, {
						method: "POST",
						headers: getAuthHeaders(),
						body: JSON.stringify({
							ticketCode: ticket.ticket_code,
							eventId: currentEvent.id,
						}),
					});

					showToast("Ticket marked as scanned!", "success");
					closeTicketModal();

					// Reload tickets
					await loadEventTickets();
				} catch (error) {
					console.error("Error scanning ticket:", error);
					showToast(error.message || "Failed to scan ticket", "error");
				}
			}

			function exportTickets() {
				if (filteredTickets.length === 0) {
					showToast("No tickets to export", "info");
					return;
				}

				// Create CSV content
				const headers = [
					"Ticket Code",
					"First Name",
					"Last Name",
					"Email",
					"Phone",
					"Purchase Date",
					"Amount",
					"Status",
					"Scanned At",
				];

				const rows = filteredTickets.map((ticket) => [
					ticket.ticket_code,
					ticket.first_name,
					ticket.last_name,
					ticket.email,
					ticket.phone || "",
					new Date(ticket.created_at).toLocaleString(),
					ticket.paid_amount,
					ticket.is_scanned ? "Used" : "Valid",
					ticket.scanned_at ? new Date(ticket.scanned_at).toLocaleString() : "",
				]);

				const csvContent = [
					headers.join(","),
					...rows.map((row) =>
						row
							.map((cell) => `"${String(cell).replace(/"/g, '""')}"`)
							.join(","),
					),
				].join("\n");

				// Download CSV
				const blob = new Blob([csvContent], { type: "text/csv" });
				const url = window.URL.createObjectURL(blob);
				const a = document.createElement("a");
				a.href = url;
				a.download = `${currentEvent.title.replace(/[^a-z0-9]/gi, "_")}_tickets_${new Date().toISOString().split("T")[0]}.csv`;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				window.URL.revokeObjectURL(url);

				showToast("Tickets exported successfully!", "success");
			}

			function showErrorState(message) {
				document.getElementById("loading").classList.add("hidden");
				document.getElementById("error").classList.remove("hidden");
				document.getElementById("errorMessage").textContent = message;
			}

			// Load tickets on page load
			loadEventTickets();
		</script>
	</body>
</html>
